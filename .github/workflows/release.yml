name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          test "$GITHUB_REF_NAME" = "$manifest_version" || {
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          }

      - name: Verify output
        run: |
          test -f main.js || { echo "main.js not found"; exit 1; }
          test -f manifest.json || { echo "manifest.json not found"; exit 1; }
          test -f styles.css || { echo "styles.css not found"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
